version: "3.8"

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: calendar
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 123456
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 10s
      timeout: 10s
      retries: 5

  calendar:
    build:
      context: ..
      dockerfile: build/Dockerfile
    ports:
      - "8888:8888"
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=calendar
      - DB_USER=postgres
      - DB_PASSWORD=123456
    depends_on:
      postgres:
        condition: service_healthy
    command: ["./calendar", "--config=configs/config.toml"]

  calendar_scheduler:
    build:
      context: ..
      dockerfile: build/Dockerfile
    environment:
      - DB_DSN=postgres://postgres:123456@postgres:5432/calendar?sslmode=disable
      - KAFKA_BROKERS=kafka:29092
      - KAFKA_TOPIC=calendar_notifications
      - LOG_LEVEL=info
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    command: ["./calendar_scheduler", "--config=/etc/calendar/scheduler_config.toml"]

  calendar_storer:
    build:
      context: ..
      dockerfile: build/Dockerfile
    environment:
      - DB_DSN=postgres://postgres:123456@postgres:5432/calendar?sslmode=disable
      - KAFKA_BROKERS=kafka:29092
      - KAFKA_TOPIC=calendar_notifications
      - KAFKA_GROUP_ID=calendar-storer-group
      - LOG_LEVEL=info
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    command: ["./calendar_storer", "--config=/etc/calendar/storer_config.toml"]

volumes:
  pgdata:
